[workspace]
resolver = "2"
members = [
    "crates/viode-core",
    "crates/viode-cli",
    "crates/viode-mcp",
    "crates/viode-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Eduard Moldovan"]
repository = "https://github.com/edimoldovan/viode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gstreamer = "0.24"
gstreamer-editing-services = "0.24"
gstreamer-pbutils = "0.24"
gstreamer-controller = "0.24"
