[package]
name = "viode-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
gstreamer.workspace = true
gstreamer-editing-services.workspace = true
gstreamer-pbutils.workspace = true
gstreamer-controller.workspace = true

[dev-dependencies]
proptest = "1"
tempfile = "3"

# macOS: gst::macos_main (Cocoa main loop for windowed preview) is behind v1_22.
[target.'cfg(target_os = "macos")'.dependencies]
gstreamer = { workspace = true, features = ["v1_22"] }
